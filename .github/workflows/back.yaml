name: CI/CD - Build, Push for nas Server

on:
  push:
    branches:
      - main
    paths:
      - 'file_ex_server/**'    # file_ex_server 디렉토리 내부가 변경될 때만 실행
  pull_request:
    paths:
      - 'file_ex_server/**'

  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "tag=$(cat ./file_ex_server/VERSION)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: ./file_ex_server
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/file-ex-server:${{ steps.version.outputs.tag }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/file-ex-server:${{ steps.version.outputs.tag }}

